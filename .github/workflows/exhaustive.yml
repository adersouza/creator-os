name: Creator OS Exhaustive

on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  exhaustive:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.6.0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - uses: astral-sh/setup-uv@v7
      - run: brew install ffmpeg tesseract
      - run: pnpm install --frozen-lockfile
      - run: uv sync --all-extras --all-packages
      - run: make exhaustive
